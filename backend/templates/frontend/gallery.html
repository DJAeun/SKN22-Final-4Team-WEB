{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hari — Gallery</title>
<link rel="icon" type="image/png" href="{% static 'images/hari_favicon.png' %}?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/NeoDunggeunmo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_eight@1.0/DOSSaemmul.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2301-wagle@1.0/WagleWagle.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --f-pixel:'DOSSaemmul',sans-serif;
  --f-playful:'WagleWagle',sans-serif;
  --f-neo:'NeoDunggeunmo',sans-serif;
  --bg:#ffffff;--ink:#2a2420;--acc:#ff7b8a;--dim:#9e9490;
  --bdr:rgba(255,123,138,0.12);--bdr2:rgba(255,123,138,0.22);
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);overflow-x:hidden;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--acc);border-radius:3px;}

/* NAV */
.gl-nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;border-bottom:.5px solid var(--bdr);background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);}
.gl-nav-logo img{height:44px;width:auto;mix-blend-mode:multiply;}
.gl-nav-right{display:flex;align-items:center;gap:2rem;}
.gl-nav-back{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-decoration:none;display:flex;align-items:center;gap:.5rem;transition:color .2s;}
.gl-nav-back:hover{color:var(--acc);}
.gl-nav-back:hover svg{transform:translateX(-3px);}
.gl-nav-back svg{transition:transform .2s;}
.gl-filter-group{display:flex;gap:.3rem;}
.gl-filter-btn{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border:.5px solid var(--bdr2);background:transparent;color:var(--dim);cursor:pointer;transition:all .2s;}
.gl-filter-btn.on,.gl-filter-btn:hover{border-color:var(--acc);color:var(--acc);}

/* HEADER */
.gl-header{margin-top:64px;padding:4rem 2.5rem 2.5rem;border-bottom:.5px solid var(--bdr);display:flex;align-items:flex-end;justify-content:space-between;}
.gl-header-left{}
.gl-eyebrow{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin-bottom:.8rem;}
.gl-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(4rem,10vw,9rem);line-height:.85;color:var(--ink);}
.gl-count{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.16em;color:var(--dim);margin-top:.8rem;}
.gl-count em{color:var(--acc);font-style:normal;}

/* GRID */
.gl-grid{padding:2rem 2.5rem 4rem;columns:4;gap:1rem;}
.gl-item{break-inside:avoid;margin-bottom:1rem;overflow:hidden;cursor:pointer;position:relative;}
.gl-item img{width:100%;display:block;transition:transform .45s cubic-bezier(.25,.46,.45,.94);}
.gl-item:hover img{transform:scale(1.04);}
.gl-item-overlay{position:absolute;inset:0;background:rgba(42,36,32,0);transition:background .3s;display:flex;align-items:flex-end;padding:1rem;}
.gl-item:hover .gl-item-overlay{background:rgba(42,36,32,0.35);}
.gl-item-num{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.14em;color:rgba(255,255,255,0);transition:color .3s;}
.gl-item:hover .gl-item-num{color:rgba(255,255,255,0.8);}

/* LIGHTBOX */
#lightbox{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;padding:2rem;}
#lightbox.show{display:flex;}
#lb-img{max-width:90vw;max-height:88vh;object-fit:contain;display:block;}
#lb-close{position:absolute;top:1.5rem;right:1.8rem;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.18em;color:rgba(255,255,255,0.7);background:transparent;border:none;cursor:pointer;text-transform:uppercase;transition:color .2s;}
#lb-close:hover{color:#fff;}
#lb-prev,#lb-next{position:absolute;top:50%;transform:translateY(-50%);font-size:1.8rem;color:rgba(255,255,255,0.5);background:transparent;border:none;cursor:pointer;padding:.5rem 1rem;transition:color .2s;}
#lb-prev:hover,#lb-next:hover{color:#fff;}
#lb-prev{left:1rem;}
#lb-next{right:1rem;}
#lb-info{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:.16em;color:rgba(255,255,255,0.5);}

/* CONTAINER QUERY — 갤러리 그리드 기준 */
.gl-body { container-type: inline-size; container-name: gl-body; }
@container gl-body (max-width: 900px) { .gl-grid { columns: 3; } }
@container gl-body (max-width: 600px) { .gl-grid { columns: 2; padding: 1.5rem; } }
@container gl-body (max-width: 360px) { .gl-grid { columns: 1; } }

/* MEDIA QUERIES */
@media(max-width:1200px){.gl-grid{columns:3;}}
@media(max-width:768px){.gl-grid{columns:2;padding:1.5rem;}.gl-header{flex-direction:column;gap:1.5rem;align-items:flex-start;}.gl-filter-group{flex-wrap:wrap;}}
@media(max-width:480px){.gl-grid{columns:2;gap:.6rem;}.gl-nav-right .gl-filter-group{display:none;}}
</style>
</head>
<body>

<!-- NAV -->
<nav class="gl-nav">
  <a class="gl-nav-logo" href="/">
    <img src="{% static 'images/hari_logo_none.png' %}?v=2" alt="HARI">
  </a>
  <div class="gl-nav-right">
    <div class="gl-filter-group">
      <button class="gl-filter-btn on" onclick="filterGallery('all',this)">All</button>
      <button class="gl-filter-btn" onclick="filterGallery('portrait',this)">Portrait</button>
      <button class="gl-filter-btn" onclick="filterGallery('fashion',this)">Fashion</button>
    </div>
    <a class="gl-nav-back" href="/">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      홈으로
    </a>
  </div>
</nav>

<!-- HEADER -->
<div class="gl-header">
  <div class="gl-header-left">
    <div class="gl-eyebrow">02 — Photo Gallery</div>
    <div class="gl-title">GALLERY</div>
    <div class="gl-count">총 <em id="visible-count">17</em>장의 사진</div>
  </div>
</div>

<!-- GRID -->
<div class="gl-grid" id="gl-grid">
  {% for i in "123456789" %}{% endfor %}
  <div class="gl-item" data-cat="portrait" onclick="openLb(0)">
    <img src="{% static 'images/hari_image1.png' %}" alt="Hari 01" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">01</span></div>
  </div>
  <div class="gl-item" data-cat="fashion" onclick="openLb(1)">
    <img src="{% static 'images/hari_image2.png' %}" alt="Hari 02" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">02</span></div>
  </div>
  <div class="gl-item" data-cat="portrait" onclick="openLb(2)">
    <img src="{% static 'images/hari_image3.png' %}" alt="Hari 03" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">03</span></div>
  </div>
  <div class="gl-item" data-cat="fashion" onclick="openLb(3)">
    <img src="{% static 'images/hari_image4.png' %}" alt="Hari 04" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">04</span></div>
  </div>
  <div class="gl-item" data-cat="portrait" onclick="openLb(4)">
    <img src="{% static 'images/hari_image5.png' %}" alt="Hari 05" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">05</span></div>
  </div>
  <div class="gl-item" data-cat="portrait" onclick="openLb(5)">
    <img src="{% static 'images/hari_image6.png' %}" alt="Hari 06" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">06</span></div>
  </div>
  <div class="gl-item" data-cat="fashion" onclick="openLb(6)">
    <img src="{% static 'images/hari_image7.png' %}" alt="Hari 07" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">07</span></div>
  </div>
  <div class="gl-item" data-cat="portrait" onclick="openLb(7)">
    <img src="{% static 'images/hari_image8.png' %}" alt="Hari 08" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">08</span></div>
  </div>
  <div class="gl-item" data-cat="fashion" onclick="openLb(8)">
    <img src="{% static 'images/hari_image9.png' %}" alt="Hari 09" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">09</span></div>
  </div>
  <div class="gl-item" data-cat="portrait" onclick="openLb(9)">
    <img src="{% static 'images/hari_image10.png' %}" alt="Hari 10" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">10</span></div>
  </div>
  <div class="gl-item" data-cat="fashion" onclick="openLb(10)">
    <img src="{% static 'images/hari_image11.png' %}" alt="Hari 11" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">11</span></div>
  </div>
  <div class="gl-item" data-cat="portrait" onclick="openLb(11)">
    <img src="{% static 'images/hari_image12.png' %}" alt="Hari 12" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">12</span></div>
  </div>
  <div class="gl-item" data-cat="fashion" onclick="openLb(12)">
    <img src="{% static 'images/hari_image13.png' %}" alt="Hari 13" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">13</span></div>
  </div>
  <div class="gl-item" data-cat="portrait" onclick="openLb(13)">
    <img src="{% static 'images/hari_image14.png' %}" alt="Hari 14" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">14</span></div>
  </div>
  <div class="gl-item" data-cat="fashion" onclick="openLb(14)">
    <img src="{% static 'images/hari_image15.png' %}" alt="Hari 15" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">15</span></div>
  </div>
  <div class="gl-item" data-cat="portrait" onclick="openLb(15)">
    <img src="{% static 'images/hari_image16.png' %}" alt="Hari 16" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">16</span></div>
  </div>
  <div class="gl-item" data-cat="fashion" onclick="openLb(16)">
    <img src="{% static 'images/hari_image17.png' %}" alt="Hari 17" loading="lazy">
    <div class="gl-item-overlay"><span class="gl-item-num">17</span></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="lbBgClose(event)">
  <button id="lb-close" onclick="closeLb()">닫기 ✕</button>
  <button id="lb-prev" onclick="lbNav(-1)">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next" onclick="lbNav(1)">&#8250;</button>
  <div id="lb-info"></div>
</div>

<script>
const IMGS = [
  "{% static 'images/hari_image1.png' %}",
  "{% static 'images/hari_image2.png' %}",
  "{% static 'images/hari_image3.png' %}",
  "{% static 'images/hari_image4.png' %}",
  "{% static 'images/hari_image5.png' %}",
  "{% static 'images/hari_image6.png' %}",
  "{% static 'images/hari_image7.png' %}",
  "{% static 'images/hari_image8.png' %}",
  "{% static 'images/hari_image9.png' %}",
  "{% static 'images/hari_image10.png' %}",
  "{% static 'images/hari_image11.png' %}",
  "{% static 'images/hari_image12.png' %}",
  "{% static 'images/hari_image13.png' %}",
  "{% static 'images/hari_image14.png' %}",
  "{% static 'images/hari_image15.png' %}",
  "{% static 'images/hari_image16.png' %}",
  "{% static 'images/hari_image17.png' %}"
];
let lbIdx = 0;
let visibleImgs = IMGS.slice();

function openLb(idx){
  lbIdx = idx;
  document.getElementById('lb-img').src = visibleImgs[idx];
  document.getElementById('lb-info').textContent = (idx+1) + ' / ' + visibleImgs.length;
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLb(){
  document.getElementById('lightbox').classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(()=>{ document.getElementById('lb-img').src=''; }, 300);
}
function lbBgClose(e){ if(e.target===document.getElementById('lightbox')) closeLb(); }
function lbNav(dir){
  lbIdx = (lbIdx + dir + visibleImgs.length) % visibleImgs.length;
  document.getElementById('lb-img').src = visibleImgs[lbIdx];
  document.getElementById('lb-info').textContent = (lbIdx+1) + ' / ' + visibleImgs.length;
}
document.addEventListener('keydown', e=>{
  if(!document.getElementById('lightbox').classList.contains('show')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowRight') lbNav(1);
  if(e.key==='ArrowLeft') lbNav(-1);
});

function filterGallery(cat, btn){
  document.querySelectorAll('.gl-filter-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const items = document.querySelectorAll('.gl-item');
  let count = 0;
  visibleImgs = [];
  items.forEach((item, i)=>{
    const show = cat==='all' || item.dataset.cat===cat;
    item.style.display = show ? '' : 'none';
    if(show){ visibleImgs.push(IMGS[i]); count++; }
  });
  // re-map onclick indices
  let vi = 0;
  items.forEach((item, i)=>{
    if(item.style.display !== 'none'){
      const idx = vi++;
      item.onclick = ()=>openLb(idx);
    }
  });
  document.getElementById('visible-count').textContent = count;
}
</script>
</body>
</html>
