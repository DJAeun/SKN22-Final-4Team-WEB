    <!-- ── 마이페이지 (기본 랜딩) ── -->
    <div class="pg on" id="pg-abouthari" data-title="About Bori">

      <!-- ① 프로필 카드: 계정정보 + 유저정보 즉시 노출 -->
      <div class="card" style="padding:0; overflow:hidden; margin-bottom:1rem;">
        <!-- 배너 -->
        <div style="height:72px; background:linear-gradient(135deg,#fce4e8 0%,#f9d6e4 55%,#e8d4f0 100%); position:relative;">
          <div style="position:absolute; inset:0; background:repeating-linear-gradient(135deg, transparent, transparent 10px, rgba(255,255,255,0.12) 10px, rgba(255,255,255,0.12) 11px);"></div>
        </div>

        <!-- 카드 본문 -->
        <div style="padding:0 1.8rem 1.8rem;">
          <!-- 아바타 + 사용자명 + Fan+ 행 -->
          <div style="display:flex; align-items:flex-start; gap:1.2rem; margin-bottom:1.8rem;">
            <!-- 아바타 (클릭 → 사진 업로드) -->
            <div class="p-av" id="avatar-btn"
                 onclick="document.getElementById('avatar-input').click()"
                 style="margin-top:-36px; width:72px; height:72px; font-size:1.6rem; flex-shrink:0; cursor:pointer; overflow:hidden; position:relative;"
                 title="프로필 사진 변경">
              <img id="avatar-preview" src="" alt=""
                   style="display:none; position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%;">
              <span id="avatar-initial">U</span>
              <div class="p-av-edit" style="z-index:1;">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </div>
            </div>
            <!-- 숨김 파일 입력 -->
            <input type="file" id="avatar-input" accept="image/*" style="display:none"
                   onchange="previewAvatar(this)">
            <!-- 사용자명 + Fan+ -->
            <div style="flex:1; padding-top:8px;">
              <div style="font-weight:500; color:var(--ink); font-size:.95rem; margin-bottom:.3rem;">{{ user.username|default:"사용자" }}</div>
              <span style="font-size:.7rem; color:var(--dim); letter-spacing:.05em;">Fan+ · 활성</span>
            </div>
          </div>

          <script>
          function previewAvatar(input) {
            if (!input.files || !input.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(e) {
              const preview = document.getElementById('avatar-preview');
              const initial = document.getElementById('avatar-initial');
              preview.src = e.target.result;
              preview.style.display = 'block';
              initial.style.display = 'none';
              toast('프로필 사진이 변경되었어요 ✓');
            };
            reader.readAsDataURL(input.files[0]);
          }
          </script>

          <!-- 계정 정보 편집 필드 2×2 -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-bottom:.6rem;">
            <div class="info-item">
              <span class="info-lbl">이름</span>
              <input class="info-val-input" type="text" placeholder="이름을 입력하세요">
            </div>
            <div class="info-item">
              <span class="info-lbl">이메일</span>
              <input class="info-val-input" type="email" placeholder="이메일을 입력하세요">
            </div>
            <div class="info-item">
              <span class="info-lbl">가입일</span>
              <span class="info-val">{{ user.date_joined|date:"Y.m.d"|default:"—" }}</span>
            </div>
            <div class="info-item">
              <span class="info-lbl">멤버십</span>
              <span class="info-val" style="color:var(--acc);">Fan+ · 활성</span>
            </div>
          </div>

          <!-- 자기소개 -->
          <div class="info-item" style="margin-bottom:1.2rem;">
            <span class="info-lbl">자기소개</span>
            <textarea class="info-val-input" placeholder="자기소개를 입력하세요" rows="2"
              style="resize:none; line-height:1.5; margin-top:.3rem; width:100%;"></textarea>
          </div>

          <!-- 저장 버튼 -->
          <button class="save-btn" onclick="toast('프로필이 저장되었어요 ✓')">저장하기 →</button>
        </div>
      </div>

      <!-- 구독 정보 카드 -->
      <div class="card" style="margin-bottom:1rem;">
        <div class="c-title">구독 정보</div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--bdr);margin-bottom:.9rem;">
          <div style="background:var(--bg);padding:.9rem 1rem;">
            <span style="font-family:'NeoDunggeunmo',monospace;font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:.25rem;">이용 중</span>
            <span style="font-size:.85rem;color:var(--acc);">● Fan+ · 활성</span>
          </div>
          <div style="background:var(--bg);padding:.9rem 1rem;">
            <span style="font-family:'NeoDunggeunmo',monospace;font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:.25rem;">다음 결제</span>
            <span style="font-size:.85rem;color:var(--ink);">2025.05.01</span>
          </div>
        </div>
        <div style="display:flex;gap:.5rem;">
          <button class="save-btn" style="background:transparent;border:0.5px solid var(--bdr2);color:var(--dim);font-size:.6rem;box-shadow:none;" onclick="window.location.href='/membership/'">구독 관리</button>
          <button class="save-btn" style="background:transparent;border:0.5px solid rgba(200,74,58,.35);color:#c84a3a;font-size:.6rem;box-shadow:none;" onclick="toast('구독을 취소하려면 고객센터에 문의해주세요')">구독 취소</button>
        </div>
      </div>

      <!-- 계정 관리 카드 -->
      <div class="card">
        <div class="c-title">계정 관리</div>
        <div class="danger-zone" style="border-radius:10px;">
          <div class="dz-title">위험 구역</div>
          <div style="display:flex;gap:.6rem;flex-wrap:wrap">
            <button class="dz-btn" onclick="window.location.href='/api/chat/logout/'">로그아웃</button>
            <button class="dz-btn" onclick="toast('계정 탈퇴는 고객센터에 문의해주세요')">회원 탈퇴</button>
          </div>
        </div>
      </div>
    </div>
