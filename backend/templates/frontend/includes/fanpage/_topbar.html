{% load static %}
<!-- TOPBAR -->
<header id="topbar">
  <div class="tb-logo" style="display:flex; align-items:center; gap:12px; padding-left:1.5rem;">
    <!-- 보리 메인 서명 로고 (확대형 및 배경 최적화) -->
    <img src="{% static 'images/bori_logo_none.png' %}?v=2" alt="Bori" style="height:42px; width:auto; object-fit:contain; filter: contrast(110%) brightness(110%); mix-blend-mode: multiply; transition: all 0.3s ease; cursor: pointer;" onmouseover="this.style.transform='scale(1.05)'; this.style.opacity='0.8';" onmouseout="this.style.transform='scale(1)'; this.style.opacity='1';">
  </div>
  <div class="tb-center">
    <div class="tb-greet">안녕하세요, <strong id="tb-name">보리팬01</strong>님 👋</div>
  </div>
  <div class="tb-right">
    <a class="tb-home" href="/">← 메인으로</a>
    <div class="tb-pts-box">
      <span class="tb-pts-ico">✦</span>
      <span class="tb-pts-num" id="tb-pts">3,250</span>
      <span class="tb-pts-lbl">pts</span>
    </div>
    <button class="tb-icon-btn">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    </button>
    <span class="tb-notif-dot"></span>
    <div class="tb-av" onclick="navTo('myinfo')">U</div>
  </div>
</header>
