{% load static %}
<style>
  #s4 {
    background: #ffffff;
    position: relative;
  }

  .s4-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 2rem 2.5rem 0.5rem;
    border-bottom: 0.5px solid var(--bdr);
  }

  .s4-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 4vw, 3.5rem);
    color: var(--ink);
    line-height: 1;
    margin: 0;
  }

  .s4-more {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--acc);
    text-decoration: none;
    border-bottom: 0.5px solid var(--acc);
    padding-bottom: 1px;
    white-space: nowrap;
    transition: color 0.2s;
  }
  .s4-more:hover { color: var(--ink); }

  /* Premium Grid Layout */
  .premium-video-grid {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 2rem;
    padding: 2rem 2.5rem 3rem;
    flex-wrap: wrap;
  }

  .premium-vid-card {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 220px; /* 창 100%일 때 세로 잘림 막기 위해 확 줄임 */
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .premium-vid-card:hover {
    transform: translateY(-10px);
  }

  /* 9:16 Shorts Wrapper */
  .premium-vid-thumb {
    position: relative;
    width: 100%;
    padding-bottom: 177.78%; 
    background: #111;
    border-radius: 18px; /* 둥근 모서리로 더 부드럽고 세련되게 */
    overflow: hidden;
    box-shadow: 0 16px 36px rgba(0,0,0,0.14); /* 고급스러운 그림자 */
    margin-bottom: 1.4rem;
  }

  .premium-vid-thumb iframe {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border: none;
  }

  /* Shorts Badge Overlap */
  .premium-shorts-badge {
    position: absolute; 
    bottom: 16px; 
    right: 16px;
    background: rgba(255, 0, 0, 0.9); 
    color: #fff; 
    font-size: 0.75rem; 
    font-weight: 700;
    padding: 5px 12px; 
    border-radius: 20px; 
    display: flex; 
    align-items: center; 
    gap: 4px;
    font-family: 'Apple SD Gothic Neo', sans-serif;
    pointer-events: none;
    box-shadow: 0 4px 10px rgba(255,0,0,0.3);
  }

  .premium-vid-info {
    text-align: left; 
    width: 100%;
    padding: 0 0.5rem;
  }
  
  .premium-vid-title { 
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    font-size: 1.05rem; 
    font-weight: 700; 
    color: var(--ink); 
    line-height: 1.3;
    margin-bottom: 0.4rem;
    letter-spacing: -0.01em;
    word-break: keep-all;
  }
  
  .premium-vid-meta {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem; 
    color: #888;
    letter-spacing: 0.05em;
    margin-bottom: 0.7rem;
    text-transform: uppercase;
  }

  .premium-vid-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    font-size: 0.9rem;
    color: #555;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
  }
  .premium-vid-link:hover {
    color: var(--acc);
  }

  @media (max-width: 900px) {
    .premium-video-grid {
      gap: 2rem;
      padding: 2rem 1.5rem 4rem;
    }
  }
</style>
