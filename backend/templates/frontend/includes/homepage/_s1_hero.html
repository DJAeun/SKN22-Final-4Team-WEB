{% load static %}
<section id="s1" class="hero-section" style="position:relative;height:100vh;overflow:hidden;background-size:cover;background-position:center;background-repeat:no-repeat;">

  <!-- 로고 -->
  <div class="hero-logo-wrap" style="position:absolute;top:60px;left:60px;z-index:10;pointer-events:none;">
    <img class="hero-logo-img" src="{% static 'images/hari_logo_none.png' %}?v=3" alt="HARI" style="height:140px;width:auto;filter:brightness(0);">
  </div>

  <!-- 하단 -->
  <div class="hero-bottom" style="font-family:var(--f-pixel);z-index:10;">
    <div class="hero-scroll-hint">
      <div class="scroll-mouse"></div>
      <div class="scroll-line"></div>
      <div class="scroll-arrow"><span></span><span></span></div>
      SCROLL
    </div>
  </div>

</section>

<style>
/* 히어로 이미지 — 라이트/다크 모드 분기 */
#s1.hero-section {
  background-image: linear-gradient(rgba(0,0,0,0.1),rgba(0,0,0,0.3)), url("{% static 'images/hari_hero_image4.png' %}");
}
html[data-theme="dark"] #s1.hero-section {
  background-image: linear-gradient(rgba(0,0,0,0.1),rgba(0,0,0,0.3)), url("{% static 'images/hari_hero_image1.png' %}");
}

/* 메인 히어로 하단 스크롤 영역 오버레이 디자인 수정 */
#s1 .hero-bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  border-top: none; /* 기존 border 제거 */
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
  padding: 5rem 4rem 2.5rem 4rem;
}

#s1 .hero-bottom-text {
  letter-spacing: 0.3em;
  font-size: 0.85rem;
}

#s1 .hero-scroll-hint {
  letter-spacing: 0.25em;
}

@media (max-width: 480px) {
  .hero-logo-wrap { top: 20px !important; left: 20px !important; }
  .hero-logo-img { height: 80px !important; }
  #s1 .hero-bottom { padding: 4rem 1.5rem 1.5rem 1.5rem; }

  /* 모바일 히어로 이미지 — 라이트 모드 */
  #s1.hero-section {
    background-image: linear-gradient(rgba(0,0,0,0.1),rgba(0,0,0,0.3)), url("{% static 'images/hari_mobile_image_light.png' %}");
  }
  /* 모바일 히어로 이미지 — 다크 모드 */
  html[data-theme="dark"] #s1.hero-section {
    background-image: linear-gradient(rgba(0,0,0,0.1),rgba(0,0,0,0.3)), url("{% static 'images/hari_mobile_image_dark.png' %}");
  }
}
</style>
