{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하리와의 대화</title>
<link rel="icon" type="image/png" href="{% static 'images/hari_favicon.png' %}?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/NeoDunggeunmo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_eight@1.0/DOSSaemmul.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --f-pixel: 'DOSSaemmul', sans-serif;
  --f-neo: 'NeoDunggeunmo', sans-serif;
  /* 하리 브랜드 컬러 */
  --hari-pink: #ff7b8a;
  --hari-mint: #06d6a0;
  --hari-pink-light: #ffb3be;
  --hari-mint-light: #8ef5d7;
  --hari-coral: #ff9aa2;
  --hari-sky: #c7ceea;
  
  /* 배경 */
  --bg-main: #FFF5F7;
  --bg-gradient: #FFF5F7;
  --bg-pattern: none;
  
  /* 말풍선 */
  --bubble-hari: linear-gradient(135deg, #ffffff 0%, #fff5f7 100%);
  --bubble-me: linear-gradient(135deg, var(--hari-pink) 0%, var(--hari-coral) 100%);
  --bubble-shadow: 0 2px 8px rgba(255, 123, 138, 0.15);
  
  /* 텍스트 */
  --text-main: #2a2420;
  --text-dim: #9e9490;
  --text-time: #c5b8b5;
  
  /* 헤더 */
  --header-bg: rgba(255, 255, 255, 0.95);
  --border: rgba(255, 123, 138, 0.1);
}

html, body {
  height: 100vh;
  margin: 0;
  overflow: hidden;
  font-family: var(--f-pixel);
  font-size: 1rem;
  background: var(--bg-main);
}

.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ═══════════════════════════════════════
   SIDEBAR LEFT (Profile)
   ═══════════════════════════════════════ */
.sidebar-left {
  width: 320px;
  background-size: cover;
  background-position: center;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 10;
  position: relative;
  overflow: hidden;
}

.sidebar-left::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.8) 60%, white 100%);
  z-index: 1;
}

.profile-section {
  position: relative;
  z-index: 2;
  padding: 40px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* ═══════════════════════════════════════
   CHAT MAIN (Center)
   ═══════════════════════════════════════ */
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-gradient);
  position: relative;
  overflow: hidden;
}

/* ═══════════════════════════════════════
   SIDEBAR RIGHT (Search/Tools)
   ═══════════════════════════════════════ */
.sidebar-right {
  width: 320px;
  background: white;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 10;
}

/* ═══════════════════════════════════════
   HEADER (하리 스타일)
   ═══════════════════════════════════════ */
.header {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(30px);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.back-btn {
  background: none;
  border: none;
  padding: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  color: var(--text-main);
  font-size: 24px;
  font-weight: 300;
  transition: transform 0.2s;
}

.back-btn:hover {
  transform: translateX(-4px);
}

.header-profile {
  display: flex;
  align-items: center;
  gap: 14px;
}

.profile-img {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--hari-pink), var(--hari-mint));
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.05em;
  box-shadow: 0 4px 12px rgba(255, 123, 138, 0.3);
  position: relative;
}

.profile-img::after {
  content: '';
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 12px;
  height: 12px;
  background: var(--hari-mint);
  border: 2px solid white;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(6, 214, 160, 0.2);
}

.profile-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.profile-name {
  font-size: 18px;
  font-weight: 500;
  color: var(--text-main);
  letter-spacing: -0.02em;
}

.profile-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--hari-mint);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.status-dot {
  width: 6px;
  height: 6px;
  background: var(--hari-mint);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(0.8); }
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-btn {
  background: none;
  border: 0.5px solid var(--border);
  padding: 8px 12px;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-radius: 8px;
  transition: all 0.2s;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.header-btn:hover {
  border-color: var(--hari-pink);
  color: var(--hari-pink);
  background: rgba(255, 123, 138, 0.05);
}

/* ═══════════════════════════════════════
   SEARCH MODAL
   ═══════════════════════════════════════ */
.search-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(42, 36, 32, 0.6);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 80px;
}

.search-modal.show {
  display: flex;
  animation: fadeIn 0.3s;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.search-container {
  background: white;
  border-radius: 20px;
  width: 90%;
  max-width: 600px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(255, 123, 138, 0.3);
  animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.search-header {
  padding: 20px 24px;
  border-bottom: 0.5px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-input-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-main);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 10px 16px;
}

.search-input-wrapper:focus-within {
  border-color: var(--hari-pink);
  background: white;
}

.search-icon {
  color: var(--text-dim);
  font-size: 18px;
}

.search-input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 15px;
  font-family: inherit;
  background: transparent;
  color: var(--text-main);
}

.search-input::placeholder {
  color: var(--text-dim);
}

.search-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 24px;
  cursor: pointer;
  padding: 4px;
  transition: color 0.2s;
}

.search-close:hover {
  color: var(--text-main);
}

.search-tabs {
  display: flex;
  gap: 4px;
  padding: 16px 24px 0;
  border-bottom: 0.5px solid var(--border);
}

.search-tab {
  background: none;
  border: none;
  padding: 10px 20px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-dim);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.search-tab.active {
  color: var(--hari-pink);
  border-bottom-color: var(--hari-pink);
}

.search-results {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

.search-results::-webkit-scrollbar {
  width: 6px;
}

.search-results::-webkit-scrollbar-thumb {
  background: var(--hari-pink);
  border-radius: 3px;
}

.search-result-item {
  padding: 16px;
  border: 0.5px solid var(--border);
  border-radius: 12px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.search-result-item:hover {
  border-color: var(--hari-pink);
  background: rgba(255, 123, 138, 0.03);
  transform: translateX(4px);
}

.search-result-date {
  font-size: 11px;
  color: var(--text-time);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.search-result-preview {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-main);
  margin-bottom: 6px;
}

.search-result-preview mark {
  background: rgba(255, 123, 138, 0.2);
  color: var(--hari-pink);
  font-weight: 500;
  padding: 2px 4px;
  border-radius: 4px;
}

.search-result-sender {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 500;
}

.search-no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}

.search-no-results-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.3;
}

.search-no-results-text {
  font-size: 15px;
  line-height: 1.6;
}

/* 날짜 필터 */
.date-filter {
  padding: 16px 24px;
  border-bottom: 0.5px solid var(--border);
  display: none;
}

.date-filter.show {
  display: block;
}

.date-filter-row {
  display: flex;
  gap: 12px;
  align-items: center;
}

.date-filter-label {
  font-size: 13px;
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  min-width: 60px;
}

.date-input {
  flex: 1;
  padding: 8px 12px;
  border: 0.5px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-main);
  background: white;
  transition: border-color 0.2s;
}

.date-input:focus {
  outline: none;
  border-color: var(--hari-pink);
}

.date-filter-btn {
  padding: 8px 16px;
  background: var(--hari-pink);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.date-filter-btn:hover {
  background: var(--hari-coral);
  transform: translateY(-1px);
}

/* ═══════════════════════════════════════
   CHAT MESSAGES AREA
   ═══════════════════════════════════════ */
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  background: var(--bg-gradient);
  background-attachment: fixed;
  position: relative;
}

.chat-container::after {
  display: none;
}

.chat-container::before {
  display: none;
}

.chat-container::-webkit-scrollbar {
  width: 8px;
}

.chat-container::-webkit-scrollbar-track {
  background: transparent;
}

.chat-container::-webkit-scrollbar-thumb {
  background: var(--hari-pink);
  border-radius: 4px;
  opacity: 0.5;
}

.chat-container::-webkit-scrollbar-thumb:hover {
  background: var(--hari-coral);
}

.messages {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 900px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* 날짜 구분선 */
.date-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 24px 0;
  gap: 16px;
}

.date-divider::before,
.date-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--border), transparent);
}

.date-divider-text {
  background: white;
  color: var(--text-dim);
  padding: 6px 20px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-family: 'DM Mono', monospace;
  border: 0.5px solid var(--border);
  box-shadow: 0 2px 8px rgba(255, 123, 138, 0.08);
}

/* 메시지 그룹 */
.message-group {
  display: flex;
  gap: 12px;
  margin-bottom: 8px;
  align-items: flex-end;
  animation: msgFadeIn 0.3s ease-out;
}

@keyframes msgFadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-group.me {
  flex-direction: row-reverse;
}

.message-group.no-animate {
  animation: none;
}

/* 프로필 이미지 */
.msg-profile {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--hari-pink), var(--hari-mint));
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 16px;
  flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(255, 123, 138, 0.25);
  letter-spacing: 0.05em;
}

.message-group.me .msg-profile {
  display: none;
}

/* 메시지 컨텐츠 */
.msg-content {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 65%;
}

.message-group.me .msg-content {
  align-items: flex-end;
}

/* 이름 */
.msg-name {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 500;
  padding: 0 4px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
}

.message-group.me .msg-name {
  display: none;
}

/* 말풍선 + 시간 + 읽음 */
.msg-bubble-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

.message-group.me .msg-bubble-row {
  flex-direction: row-reverse;
}

/* 말풍선 공통 스타일 */
.msg-bubble {
  padding: 12px 18px;
  border-radius: 20px;
  font-size: 1rem;
  font-family: var(--f-pixel);
  line-height: 1.6;
  position: relative;
  box-shadow: var(--bubble-shadow);
  word-wrap: break-word;
  max-width: 100%;
}

/* 하리 말풍선 */
.message-group.other .msg-bubble {
  background: var(--bubble-hari);
  color: var(--text-main);
  border: 0.5px solid rgba(255, 123, 138, 0.1);
}

/* 내 말풍선 */
.message-group.me .msg-bubble {
  background: var(--bubble-me);
  color: white;
  border: none;
}


/* 시간 + 읽음 */
.msg-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  align-self: flex-end;
  margin-bottom: 4px;
}

.message-group.me .msg-meta {
  align-items: flex-start;
}

.msg-time {
  font-size: 11px;
  color: var(--text-time);
  white-space: nowrap;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.03em;
}

.msg-read {
  font-size: 10px;
  color: var(--hari-pink);
  font-weight: 600;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
}

/* 타이핑 인디케이터 */
.typing-indicator {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}

.typing-bubble {
  background: white;
  padding: 14px 20px;
  border-radius: 20px;
  display: flex;
  gap: 5px;
  align-items: center;
  position: relative;
  box-shadow: var(--bubble-shadow);
  border: 0.5px solid rgba(255, 123, 138, 0.1);
}


.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--hari-pink);
  animation: typing 1.4s infinite;
}

.typing-dot:nth-child(2) {
  animation-delay: 0.2s;
}

.typing-dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes typing {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: 0.4;
  }
  30% {
    transform: translateY(-8px);
    opacity: 1;
  }
}

/* ═══════════════════════════════════════
   QUICK REPLIES (하리 스타일)
   ═══════════════════════════════════════ */
.quick-replies {
  display: flex;
  gap: 10px;
  padding: 16px 24px;
  overflow-x: auto;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  border-top: 0.5px solid var(--border);
  flex-shrink: 0;
}

.quick-replies::-webkit-scrollbar {
  height: 4px;
}

.quick-replies::-webkit-scrollbar-thumb {
  background: var(--hari-pink);
  border-radius: 2px;
}

.quick-reply-btn {
  background: white;
  border: 0.5px solid var(--border);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 14px;
  color: var(--text-main);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 2px 6px rgba(255, 123, 138, 0.08);
  font-weight: 400;
}

.quick-reply-btn:hover {
  background: var(--hari-pink);
  color: white;
  border-color: var(--hari-pink);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(255, 123, 138, 0.25);
}

/* ═══════════════════════════════════════
   INPUT AREA (하리 스타일)
   ═══════════════════════════════════════ */
.input-area {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  flex-shrink: 0;
  box-shadow: 0 -2px 12px rgba(255, 123, 138, 0.08);
}

.input-left {
  display: flex;
  gap: 8px;
}

.input-btn {
  width: 40px;
  height: 40px;
  border: 0.5px solid var(--border);
  background: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--text-dim);
  transition: all 0.2s;
  flex-shrink: 0;
  border-radius: 12px;
}

.input-btn:hover {
  border-color: var(--hari-pink);
  color: var(--hari-pink);
  background: rgba(255, 123, 138, 0.05);
}

.input-wrapper {
  flex: 1;
  background: white;
  border: 0.5px solid var(--border);
  border-radius: 24px;
  display: flex;
  align-items: flex-end;
  padding: 10px 20px;
  max-height: 120px;
  box-shadow: 0 2px 8px rgba(255, 123, 138, 0.08);
  transition: all 0.2s;
}

.input-wrapper:focus-within {
  border-color: var(--hari-pink);
  box-shadow: 0 4px 16px rgba(255, 123, 138, 0.15);
}

.input-field {
  flex: 1;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 15px;
  resize: none;
  min-height: 24px;
  max-height: 100px;
  line-height: 1.6;
  overflow-y: auto;
  color: var(--text-main);
}

.input-field::placeholder {
  color: var(--text-dim);
}

.input-field::-webkit-scrollbar {
  width: 4px;
}

.input-field::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 2px;
}

.send-btn {
  width: 44px;
  height: 44px;
  border: none;
  background: linear-gradient(135deg, var(--hari-pink), var(--hari-coral));
  color: white;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(255, 123, 138, 0.3);
}

.send-btn:hover {
  transform: translateY(-2px);

}

/* ═══════════════════════════════════════
   EMOJI PICKER
   ═══════════════════════════════════════ */
.emoji-picker {
  position: absolute;
  bottom: 80px;
  left: 24px;
  background: white;
  border: 0.5px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 8px 24px rgba(255, 123, 138, 0.2);

  max-width: 340px;
  z-index: 100;
}

.emoji-picker.show {

  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    opacity: 0;
    transform: translateY(10px);
  }
  to {

}

.emoji-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
  max-height: 220px;
  overflow-y: auto;
}

}
</style>
</head>
<body>

<div class="app-container">
  <!-- LEFT SIDEBAR: PROFILE -->
  <aside class="sidebar-left" style="background-image: url('{% static 'images/hari_image13.png' %}');">
    <!-- Full Height Overlay for Readability -->
    <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.7) 50%, rgba(255,255,255,0.95) 100%); z-index: 1;"></div>
    
    <!-- Profile Info (On top of overlay) -->
    <div style="padding: 100px 24px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; z-index: 2;">
      <div style="width: 140px; height: 140px; border-radius: 40px; overflow: hidden; border: 4px solid white; box-shadow: 0 12px 30px rgba(0,0,0,0.15); background: white; margin-bottom: 24px; transform: rotate(-3deg);">
        <img src="{% static 'images/hari_image1.png' %}" alt="Hari" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <div>

<div id="searchModal" style="display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); align-items: flex-start; justify-content: flex-end; padding: 24px;">
  <div style="background: white; width: 360px; height: auto; max-height: calc(100vh - 48px); border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
    <div style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;">
      <h3 style="font-size: 16px; font-weight: 600; color: var(--text-main);">🔍 대화 내용 검색</h3>
      <button onclick="closeSearch()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-dim);">×</button>

<style>
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

<script id="django-data" type="application/json">
  {
    "isAuthenticated": {% if user.is_authenticated %}true{% else %}false{% endif %},
    "userName": "{{ user.username|default:'' }}",
    "loginUrl": "{% url 'login' %}",
    "csrfToken": "{{ csrf_token }}"
  }
</script>

<script>
/**
 * ═══════════════════════════════════════
 * GLOBAL STATE & CONFIG
 * ═══════════════════════════════════════
 */
const djangoData = JSON.parse(document.getElementById('django-data').textContent);
const { isAuthenticated, userName, loginUrl, csrfToken } = djangoData;

const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
let chatSocket = null;
let currentSessionId = null;

// Multi-bubble queue state
let bubbleQueue = [];
let bubbleTimer = null;
let isBubbleAnimating = false;

// Message batching (debounce) state for WebSocket
let userMessageBuffer = [];
let debounceTimer = null;
const DEBOUNCE_DELAY = 1000; // ms

// Search history (populated dynamically)
let chatHistory = [];

let lastMessageDate = null;

/**
 * ═══════════════════════════════════════
 * CORE CHAT FUNCTIONS
 * ═══════════════════════════════════════
 */

// Initialize WebSocket
function connectWebSocket(sessionId = null) {
  if (chatSocket) chatSocket.close();

  const wsPath = sessionId ? `/ws/chat/${sessionId}/` : '/ws/chat/';
  chatSocket = new WebSocket(protocol + window.location.host + wsPath);

  chatSocket.onmessage = function(e) {
    let data;
    try {
        data = JSON.parse(e.data);
    } catch(err) {
        console.error("WS error parsing:", err);
        return;
    }
    
    if (data.sender === 'hari') {
      // If user is typing more, the buffer will be flushed before Hari speaks
      if (debounceTimer) {
        clearTimeout(debounceTimer);
        flushMessageBuffer();
      }

      if (isBubbleAnimating) {
        const newSegments = splitMessage(data.message);
        if (newSegments.length > 0) {
          if (bubbleQueue.length > 0) {
            bubbleQueue[bubbleQueue.length - 1].isLast = false;
          }
          newSegments.forEach((seg, i) => {
            bubbleQueue.push({ text: seg, isLast: i === newSegments.length - 1 });
          });
        }
      } else {
        appendHariMessage(data.message);
      }
    }
  };

  chatSocket.onclose = function(e) {
    if (e.code === 4401) {
      window.location.href = loginUrl;
    }
    console.log('Chat socket closed.');
  };
}

// Send Message Logic
function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text) return;
  
  if (!isAuthenticated) {
    alert('로그인이 필요해! 🌸');
    window.location.href = loginUrl;
    return;
  }
  
  // Add to UI immediately
  addMessage('me', text);
  
  // Clear input
  input.value = '';
  input.style.height = 'auto';

  // Handle WebSocket transmission OR Local Fallback
  if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
    userMessageBuffer.push(text);
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(flushMessageBuffer, DEBOUNCE_DELAY);
  } else {
    // Local Fallback Simulation
    showTyping();
    setTimeout(() => {
      hideTyping();
      const reply = getHariReply(text);
      appendHariMessage(reply);
    }, 1000 + Math.random() * 1000);
  }
}

function flushMessageBuffer() {
  if (userMessageBuffer.length === 0) return;
  const combined = userMessageBuffer.join('\n');
  userMessageBuffer = [];
  debounceTimer = null;
  
  showTyping();
  if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
    chatSocket.send(JSON.stringify({ 'message': combined }));
  }
}

// UI Rendering for Hari (Multi-bubble support)
function splitMessage(text) {
  if (!text) return [];
  return text.split(/\n\n+/).filter(s => s.trim().length > 0);
}

function renderSingleHariBubble(text, options = {}) {
  const { isFirst = true, isLast = true, animate = true } = options;
  const messages = document.getElementById('messages');
  const now = new Date();
  const timeStr = formatTime(now);
  const dateKey = checkAndAddDateDivider(now);
  
  chatHistory.push({ date: dateKey, time: timeStr, sender: 'hari', text: text });

  const html = `
    <div class="message-group other ${animate ? '' : 'no-animate'}">
      <div class="msg-profile" style="${isFirst ? '' : 'visibility: hidden; height: 0; margin-top: -8px;'}">
        <img src="{% static 'images/hari_image1.png' %}" style="width: 100%; height: 100%; border-radius: inherit; object-fit: cover;">
      </div>
      <div class="msg-content">
        ${isFirst ? '<div class="msg-name">하리</div>' : ''}
        <div class="msg-bubble-row">
          <div class="msg-bubble">${escapeHtml(text)}</div>
          ${isLast ? `<div class="msg-meta"><span class="msg-time">${timeStr}</span></div>` : ''}
        </div>
      </div>
    </div>
  `;
  messages.insertAdjacentHTML('beforeend', html);
  scrollToBottom(animate);
}

function appendHariMessage(text, isHistory = false) {
  const segments = splitMessage(text);
  if (segments.length === 0) return;

  if (isHistory) {
    hideTyping();
    segments.forEach((seg, i) => {
      renderSingleHariBubble(seg, { isFirst: i === 0, isLast: i === segments.length - 1, animate: false });
    });
    return;
  }

  isBubbleAnimating = true;
  const firstDelay = 1000 + Math.random() * 500;
  bubbleTimer = setTimeout(() => {
    hideTyping();
    renderSingleHariBubble(segments[0], { isFirst: true, isLast: segments.length === 1, animate: true });

    if (segments.length > 1) {
      bubbleQueue = segments.slice(1).map((seg, i) => ({ text: seg, isLast: i === segments.length - 2 }));
      scheduleNextBubble();
    } else {
      isBubbleAnimating = false;
    }
  }, firstDelay);
}

function scheduleNextBubble() {
  if (bubbleQueue.length === 0) {
    isBubbleAnimating = false;
    return;
  }
  showTyping();
  const delay = 1200 + Math.random() * 800;
  bubbleTimer = setTimeout(() => {
    hideTyping();
    const item = bubbleQueue.shift();
    renderSingleHariBubble(item.text, { isFirst: false, isLast: item.isLast, animate: true });
    scheduleNextBubble();
  }, delay);
}

/**
 * ═══════════════════════════════════════
 * UI HELPERS & UTILS
 * ═══════════════════════════════════════
 */

function addMessage(sender, content, type = 'text') {
  const messages = document.getElementById('messages');
  const now = new Date();
  const dateKey = checkAndAddDateDivider(now);
  const timeStr = formatTime(now);
  const displayContent = type === 'text' ? escapeHtml(content) : content;
  
  chatHistory.push({ date: dateKey, time: timeStr, sender: sender, text: type === 'text' ? content : '[파일]' });
  
  if (sender === 'me') {
    const html = `
      <div class="message-group me">
        <div class="msg-content">
          <div class="msg-bubble-row">
            <div class="msg-meta"><span class="msg-time">${timeStr}</span></div>
            <div class="msg-bubble">${displayContent}</div>
          </div>
        </div>
      </div>
    `;
    messages.insertAdjacentHTML('beforeend', html);
  } else {
    renderSingleHariBubble(content);
    return;
  }
  scrollToBottom(true);
}

function checkAndAddDateDivider(date) {
  const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  const dateStr = date.toLocaleDateString('ko-KR', dateOptions);
  const dateKey = date.toISOString().split('T')[0]; // YYYY-MM-DD
  
  if (lastMessageDate !== dateKey) {
    const messages = document.getElementById('messages');
    // 중복 방지: 이미 해당 날짜의 구분선이 있는지 확인
    const dividers = Array.from(document.querySelectorAll('.date-divider-text'));
    const exists = dividers.some(el => el.textContent.trim() === dateStr.trim());
    
    if (!exists) {
      const dividerHTML = `<div class="date-divider"><span class="date-divider-text">${dateStr}</span></div>`;
      messages.insertAdjacentHTML('beforeend', dividerHTML);
    }
    lastMessageDate = dateKey;
  }
  return dateKey;
}

function formatTime(date) {
  let hours = date.getHours();
  const minutes = date.getMinutes();
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12 || 12;
  return `${ampm} ${hours}:${String(minutes).padStart(2, '0')}`;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

function scrollToBottom(force = false) {
  const container = document.getElementById('chatContainer');
  if (!container) return;
  const isNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 200;
  if (force || isNearBottom) {
    setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
  }
}

function showTyping() {
  if (document.getElementById('typingIndicator')) return;
  const messages = document.getElementById('messages');
  const typingHTML = `
    <div class="typing-indicator" id="typingIndicator">
      <div class="msg-profile">
        <img src="{% static 'images/hari_image1.png' %}" style="width: 100%; height: 100%; border-radius: inherit; object-fit: cover;">
      </div>
      <div class="typing-bubble">
        <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
      </div>
    </div>
  `;
  messages.insertAdjacentHTML('beforeend', typingHTML);
  scrollToBottom(true);
}

function hideTyping() {
  const typing = document.getElementById('typingIndicator');
  if (typing) typing.remove();
}

/**
 * ═══════════════════════════════════════
 * SEARCH & SIDEBAR LOGIC
 * ═══════════════════════════════════════
 */

function openSearch() {
  const modal = document.getElementById('searchModal');
  modal.style.display = 'flex';
  setTimeout(() => { document.getElementById('searchInput').focus(); }, 100);
}

function closeSearch() {
  document.getElementById('searchModal').style.display = 'none';
}

function switchSearchTab(event, tab) {
  document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('dateFilter').style.display = (tab === 'date') ? 'flex' : 'none';
}

function performSearch() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const resultsContainer = document.getElementById('searchResults');
  if (!query) {
    resultsContainer.innerHTML = '<div class="search-no-results">검색어를 입력해줘!</div>';
    return;
  }
  const results = chatHistory.filter(msg => msg.text.toLowerCase().includes(query));
  displaySearchResults(results, query);
}

function searchByDate() {
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  if (!from || !to) { alert('날짜를 모두 선택해줘!'); return; }
  const results = chatHistory.filter(msg => msg.date >= from && msg.date <= to);
  displaySearchResults(results);
}

function displaySearchResults(results, keyword = null) {
  const container = document.getElementById('searchResults');
  if (results.length === 0) {
    container.innerHTML = '<div class="search-no-results">결과가 없어 😥</div>';
    return;
  }
  let html = '';
  results.forEach(msg => {
    let preview = msg.text;
    if (keyword) {
      const regex = new RegExp(`(${keyword})`, 'gi');
      preview = preview.replace(regex, '<mark>$1</mark>');
    }
    html += `
      <div class="search-result-item" onclick="alert('이동 기능 준비 중!')">
        <div class="search-result-date">${msg.date} ${msg.time}</div>
        <div class="search-result-preview">${preview}</div>
        <div class="search-result-sender">${msg.sender === 'hari' ? '하리' : '나'}</div>
      </div>
    `;
  });
  container.innerHTML = html;
}

/**
 * ═══════════════════════════════════════
 * EVENT LISTENERS
 * ═══════════════════════════════════════
 */

// Input sizing & shortcuts
function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
}

function handleKeyPress(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}


// Global Click Handlers
document.addEventListener('click', (e) => {
  // Global click outside handlers can represent here
});

// File Upload
function handleFileUpload(event) {
  const files = event.target.files;
  if (!files || files.length === 0) return;
  for (let file of files) {
    const reader = new FileReader();
    reader.onload = (e) => {
      let content = file.type.startsWith('image/') 
        ? `<img src="${e.target.result}" style="max-width:100%; border-radius:12px; margin-top:5px; cursor:pointer;" onclick="window.open(this.src)">`
        : `<div style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.05); padding:10px; border-radius:8px;">📄 <span>${file.name}</span></div>`;
      addMessage('me', content, 'media');
    };
    reader.readAsDataURL(file);
  }
  event.target.value = '';
}

// ESC Key
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSearch(); });

// Back Button
function goBack() { window.history.back(); }

// Fallback Reply patterns (Local Mode)
const HARI_RESPONSES = {
  '안녕': ['안녕! 😊', '반가워! 오늘 뭐하고 지냈어? ✨', '어 왔어? 오늘 기분 어때?'],
  '뭐해': ['나는 너랑 대화 중이지! 이게 제일 재밌어 💕', '방금까지 새 옷 입어보고 사진 찍고 있었어 📸'],
  '좋아': ['나도 좋아! 💕', '완전 공감이네 ✨'],
  'default': ['오, 그럴 수도 있겠네! 🤔', '와, 재밌는 이야기네 ✨', '그 말 들으니까 나도 기분이 좋아져 💛']
};

function getHariReply(userText) {
  const text = userText.toLowerCase();
  for (const [keyword, responses] of Object.entries(HARI_RESPONSES)) {
    if (keyword === 'default') continue;
    if (text.includes(keyword)) return responses[Math.floor(Math.random() * responses.length)];
  }
  return HARI_RESPONSES.default[Math.floor(Math.random() * HARI_RESPONSES.default.length)];
}

// Initial Load
window.addEventListener('load', () => {
  scrollToBottom(true);
  connectWebSocket();
});
</script>


</body>
